<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Site statistics · Kevin Bell</title>
    <script>
      // Apply a saved Light or Dark choice before paint. This page's theme
      // control and the main site's save it under the same key.
      try {
        var theme = localStorage.getItem('kevinbell-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (_) {
        // Auto follows the operating system.
      }
    </script>
  </head>
  <body>
    <div id="stats-root"></div>
    <noscript><p class="noscript">The private statistics page needs JavaScript.</p></noscript>
    <script type="module" src="/src/stats/main.tsx"></script>
  </body>
</html>

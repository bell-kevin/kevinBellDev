<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin Bell</title>
    <meta
      name="description"
      content="Kevin Bell — Software Engineer at the U.S. Department of War. M.S. Computer Science, FLOSS advocate, hackathon winner."
    />
    <!-- Marks the page as JavaScript-capable. Anything in the stylesheet that
         depends on JS is scoped to html.js, so browsers with JavaScript
         disabled fall back to a fully visible, static page. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      (function () {
        var el = document.documentElement;
        el.classList.add('js');
        // The module bundle is deferred, so it runs before DOMContentLoaded.
        // If it still hasn't reported in by then it never ran at all — blocked
        // by an extension, 404'd after a deploy, or failed to parse. Drop back
        // to the no-JS layout instead of leaving the scroll-reveal sections
        // hidden forever behind a reveal that is never coming.
        document.addEventListener('DOMContentLoaded', function () {
          if (!el.classList.contains('js-ready')) el.classList.remove('js');
        });
      })();
    </script>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
